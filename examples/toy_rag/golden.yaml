cases:
  - id: P01
    group: policy
    user: anna
    question: How quickly do we have to notify the supervisory authority about a breach?
    relevant: {title_prefix: ["Incident protocol"]}
    facts: ["72 hours"]
    reference: The supervisory authority must be notified within 72 hours.
  - id: P02
    group: policy
    user: ben
    question: Who must be told first when a data breach is suspected?
    relevant: {title_prefix: ["Incident protocol"]}
    facts: [["data protection officer", "DPO"], "2 hours"]
    reference: The data protection officer, within 2 hours.
  - id: P03
    group: policy
    user: anna
    question: How much mileage is reimbursed per kilometre?
    relevant: {ids: [pol-2]}
    facts: ["0.30 EUR"]
    reference: Mileage is reimbursed at 0.30 EUR per kilometre.
  - id: P04
    group: policy
    user: ben
    question: May I process client data on my private laptop when working remotely?
    relevant: {title_prefix: ["Remote work policy"]}
    facts: ["prohibited"]
    reference: No. Client data may only be processed on company devices; private devices are prohibited.
