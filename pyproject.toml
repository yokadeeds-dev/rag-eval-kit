[project]
name = "rag-eval-kit"
version = "0.1.0"
description = "Evaluate a RAG system through its real code path: deterministic retrieval gate, DeepEval + RAGAS with a Claude judge, grader self-checks."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.13",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
deepeval = ["deepeval==4.2.8"]
# ragas 0.4.3 imports a module that langchain-community 0.4 removed
ragas = ["ragas==0.4.3", "langchain-community==0.3.31"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
rag-eval = "ragevalkit.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ragevalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9", "I", "UP", "B"]
